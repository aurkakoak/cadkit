name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after checks pass
        type: boolean
        default: false
      python_only:
        description: Build only the Python package and skill (skip desktop installers)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    if: ${{ !inputs.python_only }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/CadKit.app/Contents/MacOS/CadKit
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/CadKit.app/Contents/MacOS/CadKit
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            executable: release/linux-unpacked/cadkit-desktop
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            executable: release/linux-arm64-unpacked/cadkit-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: uv sync --locked --extra desktop
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python scripts/release_metadata.py --tag "$RELEASE_TAG"
      - run: uv run --locked pytest tests -q
      - run: npm ci
        working-directory: desktop
      - run: npm run test:runtime
        working-directory: desktop
      - run: npm run bundle:python
        working-directory: desktop
      - name: Build installers
        working-directory: desktop
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '6'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing GitHub secrets expand to empty strings. electron-builder
          # interprets an empty CSC_LINK as a certificate path at the cwd.
          for signing_variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!signing_variable:-}" ]]; then
              unset "$signing_variable"
            fi
          done
          npm run package -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Launch the packaged app with its bundled worker
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CADKIT_TEST_SOFTWARE_RENDERING: '1'
        run: npm run smoke:package -- "${{ matrix.executable }}"
      - name: Install Linux desktop test libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Launch the Linux package with its bundled worker
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          CADKIT_TEST_SOFTWARE_RENDERING: '1'
          CADKIT_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run smoke:package -- "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            desktop/release/CadKit-*.dmg
            desktop/release/CadKit-*.zip
            desktop/release/CadKit-*.tar.gz

  python-and-skill:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - run: uv build --no-sources
      - run: uvx --from 'twine>=6,<7' twine check --strict dist/*
      - run: uv run --no-project --python 3.12 python scripts/check_distribution.py
      - run: uv run --no-project python scripts/sync_skill.py --check
      - run: uv run --no-project python scripts/release_metadata.py --skill dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-and-skill
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.python_only)
    needs: [package, python-and-skill]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-and-skill
          path: dist
      - name: Validate complete asset set and compute checksums
        run: |
          VERSION=$(python3 scripts/release_metadata.py --checksums dist)
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            python3 scripts/release_metadata.py --tag "${SOURCE_REF#refs/tags/}"
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
              echo "Tag $RELEASE_TAG already exists. Run the workflow from that tag, or choose a new version." >&2
              exit 1
            else
              status=$?
              if [[ "$status" != 2 ]]; then
                echo "Could not verify that the release tag is unused." >&2
                exit "$status"
              fi
            fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false --latest

  publish-pypi:
    needs: [checks, python-and-skill, publish]
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
      needs['python-and-skill'].result == 'success' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.python_only)) }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/cadkit-py/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
      - uses: actions/download-artifact@v4
        with:
          name: python-and-skill
          path: dist
      - name: Publish Python distributions
        run: uv publish --trusted-publishing always dist/cadkit_py-*.whl dist/cadkit_py-*.tar.gz
