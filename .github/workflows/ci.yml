name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: uv sync --locked --extra desktop
      - run: uv run --locked pytest tests -q
      - run: uv run --locked python scripts/release_metadata.py
      - run: uv run --locked python scripts/sync_skill.py --check
      - run: npm ci
        working-directory: desktop
      - run: npm run setup
        working-directory: desktop
      - run: npm run test:runtime && npm run build
        working-directory: desktop
      - name: Install desktop test system libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Install browser for focused UI tests
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Exercise the desktop and MCP bridge
        working-directory: desktop
        env:
          CADKIT_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
          CADKIT_TEST_NO_SANDBOX: '1'
          CADKIT_TEST_SOFTWARE_RENDERING: '1'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: desktop/test-results/
          if-no-files-found: ignore

  macos-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run test:runtime
        working-directory: desktop

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
          enable-cache: true
      - run: uv run --locked --only-group docs python scripts/build_site.py
      - name: Verify skills CLI discovery
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes skills add ./skill --list
