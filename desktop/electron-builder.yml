appId: dev.cadkit.desktop
productName: CadKit
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: bundle/python
    to: python
    filter:
      - "**/*"
      - "!**/__pycache__/**/*"
      - "!**/*.pyc"
  - from: ../examples
    to: examples
    filter:
      - "*.py"
  - from: ../site/assets/mark.svg
    to: cadkit.svg
asar: true
npmRebuild: false
beforePack: scripts/check-bundle.cjs
publish: null
mac:
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
  artifactName: CadKit-${version}-macos-${arch}.${ext}
  hardenedRuntime: true
linux:
  executableName: cadkit-desktop
  category: Graphics
  target:
    - tar.gz
  artifactName: CadKit-${version}-linux-${arch}.${ext}
